# Deploy Transcription API to Cloud Run (production).
# Triggered on push to main.

name: Deploy Production

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/**"
      - "Dockerfile"

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      project_id: ruxailab-prod
      region: us-central1
      repo: containers
      image: transcription-api
      service: transcription-api
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY_PROD }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY_PROD }}
