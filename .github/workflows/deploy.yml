# Deploy Transcription API to Cloud Run (CPU-only).
#
# Required GitHub Secrets:
#   - GCP_SA_KEY: JSON key for a GCP service account with Cloud Build,
#     Artifact Registry Writer, Cloud Run Admin, and Service Account User roles
#   - OPENAI_API_KEY: injected into the Cloud Run service as an env var

name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ruxailab-develop
  REGION: us-central1
  REPO: containers
  IMAGE: transcription-api
  SERVICE: transcription-api

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Build and push image
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${IMAGE}:${TAG}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"
          gcloud builds submit --tag "${IMAGE_URI}" .

      - name: Deploy to Cloud Run
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE_URI}" \
            --region "${REGION}" \
            --allow-unauthenticated \
            --cpu 2 \
            --memory 2Gi \
            --port 8000 \
            --set-env-vars "DEVICE=cpu,OPENAI_API_KEY=${OPENAI_API_KEY}"
