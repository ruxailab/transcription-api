# Deploy Transcription API to Cloud Run (development).
# Triggered on push to develop.

name: Deploy Development

on:
  push:
    branches:
      - develop
    paths:
      - "app/**"
      - ".github/workflows/**"
      - "Dockerfile"

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      environment: development
      project_id: ruxailab-develop
      service: transcription-api-dev
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY_DEV }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY_DEV }}
